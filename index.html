}

function renderParagraphText(article,pIndex){
  const text=article.paragraphs[pIndex];
  const anns=(article.annotations||[]).filter(a=>a.paragraphIndex===pIndex&&Number.isInteger(a.start)&&Number.isInteger(a.end)&&a.end>a.start).map(a=>({...a,start:Math.max(0,Math.min(text.length,a.start)),end:Math.max(0,Math.min(text.length,a.end))}));
  if(!anns.length)return esc(text);
  const bounds=new Set([0,text.length]);anns.forEach(a=>{bounds.add(a.start);bounds.add(a.end)});const pts=[...bounds].sort((a,b)=>a-b);let html='';
  for(let i=0;i<pts.length-1;i++){
    const s=pts[i],e=pts[i+1];if(e<=s)continue;const seg=esc(text.slice(s,e));const covering=anns.filter(a=>a.start<=s&&a.end>=e);const highlighted=covering.filter(a=>a.showHighlight);const ids=covering.map(a=>a.id);

    anns.filter(a=>a.end===e&&a.type==='note'&&richHasText(a.noteHtml||a.note||'')).forEach(a=>{html+=`<button class="note-anchor" data-anchor-ann="${a.id}" title="Open note"></button>`});
  }
  return html;
}

    grid.addEventListener('dragover',e=>{const from=currentAnnotations().find(a=>a.id===state.draggingAnnId);if(!from||from.paragraphIndex!==Number(grid.dataset.noteGrid))return;e.preventDefault();grid.classList.add('drag-active')});
    grid.addEventListener('drop',e=>{if(e.target.closest('.note-card'))return;e.preventDefault();reorderAnnotation(state.draggingAnnId,null,true)});
  })
}
function reorderAnnotation(dragId,targetId,toEnd){
  if(!dragId)return;updateArticle(a=>{const drag=a.annotations.find(x=>x.id===dragId);if(!drag)return a;const p=drag.paragraphIndex;const ordered=a.annotations.filter(x=>x.paragraphIndex===p).slice().sort((x,y)=>(Number(x.order)||Number(x.createdAt)||0)-(Number(y.order)||Number(y.createdAt)||0));const from=ordered.findIndex(x=>x.id===dragId);if(from<0)return a;const [item]=ordered.splice(from,1);let idx=toEnd?ordered.length:ordered.findIndex(x=>x.id===targetId);if(idx<0)idx=ordered.length;ordered.splice(idx,0,item);ordered.forEach((x,i)=>x.order=i+1);return a},false);state.draggingAnnId=null;render()
}
function exportBackup(){const blob=new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`reading-workspace-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);showToast('Backup downloaded')}
async function restoreBackup(e){const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text());const next=migrate(raw);if(!Array.isArray(next.articles))throw new Error('invalid');if(!confirm(`Restore ${next.articles.length} article(s) from this backup? Current local data will be replaced.`))return;state.data=next;state.selectedArticleId=next.articles[0]?.id||null;save();state.settingsOpen=false;render();showToast('Backup restored')}catch{alert('This backup file could not be read.')}finally{e.target.value=''}}
function openArticle(id){state.selectedArticleId=id;state.view='reader';state.draftNote=null;state.editingAnnId=null;state.activeAnnId=null;render()}
function deleteArticle(id){const a=state.data.articles.find(x=>x.id===id);if(!a)return;if(!confirm(`Delete “${a.title}”?\n\nThis will also delete its local notes, highlights, and expression cards.`))return;state.data.articles=state.data.articles.filter(x=>x.id!==id);if(state.selectedArticleId===id)state.selectedArticleId=state.data.articles[0]?.id||null;save();state.view='library';render()}
function bindModal(){const backdrop=document.getElementById('backdrop');if(backdrop)backdrop.onclick=e=>{if(e.target===backdrop){state.modal=null;render()}};['closeModal','cancelModal'].forEach(id=>{const el=document.getElementById(id);if(el)el.onclick=()=>{state.modal=null;render()}});const textIn=document.getElementById('textIn');if(textIn)textIn.oninput=()=>{const n=splitParagraphs(textIn.value).length;const editing=state.modal?.mode==='edit';const a=editing?state.data.articles.find(x=>x.id===state.modal.id):null;document.getElementById('count').textContent=`${n} paragraphs detected${editing&&a&&hasAnyAnnotations(a)?' · Changing the article body will reset annotations/highlights for this article.':''}`};const saveBtn=document.getElementById('saveArticle');if(saveBtn)saveBtn.onclick=saveArticleFromModal}
function saveArticleFromModal(){const title=document.getElementById('titleIn').value.trim(),source=document.getElementById('sourceIn').value.trim(),url=document.getElementById('urlIn').value.trim(),text=document.getElementById('textIn').value;const paragraphs=splitParagraphs(text);if(!title||!paragraphs.length){alert('Please add a title and article text.');return}if(state.modal.mode==='new'){const a={id:`article-${Date.now()}`,title,source:source||'Imported text',url,createdAt:new Date().toISOString().slice(0,10),status:'New',paragraphs,annotations:[],expressions:[]};state.data.articles.unshift(a);state.selectedArticleId=a.id;state.modal=null;state.view='reader';save();render();return}const idx=state.data.articles.findIndex(x=>x.id===state.modal.id);if(idx<0)return;const old=state.data.articles[idx];const bodyChanged=JSON.stringify(old.paragraphs)!==JSON.stringify(paragraphs);if(bodyChanged&&hasAnyAnnotations(old)){if(!confirm('You changed the article body. Existing highlights, notes, and expression cards are tied to the current text, so they will be cleared to avoid attaching them to the wrong words. Continue?'))return}state.data.articles[idx]={...old,title,source:source||'Imported text',url,paragraphs,annotations:bodyChanged?[]:old.annotations,expressions:bodyChanged?[]:old.expressions};state.modal=null;save();render()}
function captureSelection(e){if(e.target.closest('button'))return;const sel=window.getSelection();if(!sel||sel.isCollapsed)return hideToolbar();const raw=sel.toString();if(!raw.trim())return hideToolbar();const range=sel.getRangeAt(0);const startEl=range.startContainer.nodeType===3?range.startContainer.parentElement:range.startContainer;const endEl=range.endContainer.nodeType===3?range.endContainer.parentElement:range.endContainer;const startP=startEl?.closest?.('.ptext'),endP=endEl?.closest?.('.ptext');if(!startP||!endP||startP!==endP){sel.removeAllRanges();showToast('For now, make one annotation within a single paragraph.');return}const pIndex=Number(startP.dataset.ptext);const pre=range.cloneRange();pre.selectNodeContents(startP);pre.setEnd(range.startContainer,range.startOffset);const start=pre.toString().length;const leading=raw.length-raw.trimStart().length;const trailing=raw.length-raw.trimEnd().length;const s=start+leading,ePos=start+raw.length-trailing;if(ePos<=s)return hideToolbar();state.translation=null;state.selectionDraft={paragraphIndex:pIndex,start:s,end:ePos,quote:raw.trim(),popupX:e.clientX-40,popupY:e.clientY-48};const tb=document.getElementById('selectionToolbar');if(tb){tb.style.display='flex';const x=Math.min(window.innerWidth-245,Math.max(10,e.clientX-55));const y=Math.max(66,e.clientY-48);tb.style.left=`${x}px`;tb.style.top=`${y}px`}}
function hideToolbar(){const tb=document.getElementById('selectionToolbar');if(tb)tb.style.display='none'}
function globalMouseDown(e){const tb=document.getElementById('selectionToolbar');if(tb&&tb.style.display!=='none'&&!tb.contains(e.target)&&!e.target.closest('.ptext'))hideToolbar()}
function saveSelectionHighlight(){if(!state.selectionDraft)return;const d=state.selectionDraft;addAnnotation({...d,id:`ann-${Date.now()}-${Math.random()}`,type:'highlight',showHighlight:true,noteHtml:'',function:'',relation:'',target:'',cardWidth:'half',order:Date.now(),createdAt:Date.now()});state.selectionDraft=null;window.getSelection()?.removeAllRanges();render()}
function startSelectionNote(){if(!state.selectionDraft)return;state.draftNote={...state.selectionDraft,type:'note',showHighlight:false,noteHtml:'',function:'',relation:'',target:'',cardWidth:'half',order:Date.now(),createdAt:Date.now()};state.selectionDraft=null;state.editingAnnId=null;window.getSelection()?.removeAllRanges();render()}
function addAnnotation(ann){updateArticle(a=>{a.annotations.push(ann);return a})}
function editAnnotation(id){const x=currentAnnotations().find(a=>a.id===id);if(!x)return;state.draftNote=structuredClone(x);state.draftNote.type='note';state.editingAnnId=id;render()}
function saveDraftNote(){const d=state.draftNote;if(!d)return;const editor=document.getElementById('draftText');const noteHtml=sanitizeRich(editor?.innerHTML||'');const fn=document.getElementById('draftFunction')?.value||'';const rel=document.getElementById('draftRelation')?.value||'';const target=document.getElementById('draftTarget')?.value||'';const hl=document.getElementById('draftHighlight');const next={...d,noteHtml,note:'',function:fn,relation:rel,target,showHighlight:d.start==null?false:!!hl?.checked,type:'note',cardWidth:d.cardWidth==='full'?'full':'half',order:Number.isFinite(Number(d.order))?Number(d.order):Date.now(),createdAt:d.createdAt||Date.now()};updateArticle(a=>{if(state.editingAnnId){const idx=a.annotations.findIndex(x=>x.id===state.editingAnnId);if(idx>=0)a.annotations[idx]=next}else{next.id=`ann-${Date.now()}-${Math.random()}`;a.annotations.push(next)}return a},false);state.draftNote=null;state.editingAnnId=null;render()}
function deleteAnnotation(id){updateArticle(a=>{a.annotations=a.annotations.filter(x=>x.id!==id);return a},false);if(state.activeAnnId===id)state.activeAnnId=null;if(state.editingAnnId===id){state.editingAnnId=null;state.draftNote=null}render()}
function openAnnotation(id){const x=currentAnnotations().find(a=>a.id===id);if(!x)return;state.activeAnnId=id;render();setTimeout(()=>scrollToAnnotation(x),0)}
function scrollToAnnotation(x){const p=document.querySelector(`[data-paragraph="${x.paragraphIndex}"]`);if(!p)return;p.scrollIntoView({behavior:'smooth',block:'center'});p.classList.add('para-flash');setTimeout(()=>p.classList.remove('para-flash'),1250)}
render();
})();
</script>
